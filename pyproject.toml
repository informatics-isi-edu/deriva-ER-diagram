[project]
name = "deriva-erd"
description = "Generate ER diagrams from an ERMrest catalog"
requires-python = ">=3.12"
dynamic = ["version"]
dependencies = ["deriva>=1.7.13"]

# 1.7.13 is unreleased on PyPI. It moved the Credenza auth endpoints, so anything
# older fails to log in. Drop this block once it ships.
[tool.uv.sources]
deriva = { git = "https://github.com/informatics-isi-edu/deriva-py.git" }

[project.scripts]
deriva-erd = "deriva.erd.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deriva"]

[tool.hatch.version]
path = "src/deriva/erd/__init__.py"
